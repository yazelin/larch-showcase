name: Daily Larch Works Sync & Showcase Deploy

on:
  schedule:
    # 每天固定在台灣時間 10:00 (UTC 02:00) 自動執行
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'index.html'
      - 'app.js'
      - 'style.css'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-stats'
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Larch Stats & Browse Works
        env:
          LARCH_API_KEY: ${{ secrets.LARCH_API_KEY }}
        run: |
          python3 scripts/fetch_stats.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily sync larch works & stats [skip ci]"
            for i in {1..3}; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
