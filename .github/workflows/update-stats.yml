name: Daily Larch Works Sync & Showcase Deploy

on:
  schedule:
    # 每天固定在台灣時間 10:00 (UTC 02:00) 自動執行
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'index.html'
      - 'dashboard.html'
      - 'app.js'
      - 'style.css'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-stats'
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 手動觸發時預設會 checkout 觸發當下的那個 commit,不一定是最新的 main;資料要疊在最新的上面
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Larch Stats & Browse Works
        env:
          LARCH_API_KEY: ${{ secrets.LARCH_API_KEY }}
        run: |
          python3 scripts/fetch_stats.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): daily sync larch works & stats [skip ci]"
            # 資料每次都整份重抓,跟別的 run 撞到時以這次抓的為準(-X theirs 在 rebase 裡指正在重放的這個 commit)。
            # 三次都推不上去就讓這一步失敗,不然下面會把有衝突標記的檔案部署上 Pages(2026-10-16 發生過)
            ok=0
            for i in {1..3}; do
              if git pull --rebase -X theirs origin main && git push origin main; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
